# =============================================================================
# FIX: K8S-009 — inline base64 Secrets committed to Git
# -----------------------------------------------------------------------------
# BEFORE (vulnerable):
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: backend-secrets
#   data:
#     db-password: cGFzc3dvcmQxMjM=      # base64 is NOT encryption —
#     api-key: c2stbGl2ZS1hYmMxMjM=      # plaintext in Git history forever
#
# AFTER (fixed):
#   - Inline Secret manifests deleted from the repo; leaked values ROTATED.
#   - Secrets live only in AWS Secrets Manager; ESO syncs them into the
#     cluster at runtime via the ExternalSecret below. Git contains only
#     references, never values.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: citizen-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backend-secrets            # same Secret name — drop-in replacement
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: citizen/backend/db-password
    - secretKey: api-key
      remoteRef:
        key: citizen/backend/api-key
