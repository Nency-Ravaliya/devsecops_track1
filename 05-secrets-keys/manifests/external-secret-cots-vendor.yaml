# =============================================================================
# ExternalSecret — COTS vendor workload
# -----------------------------------------------------------------------------
# The COTS product requires a vendor license key. Previously this was baked
# into the image / an inline Secret manifest. Now it is held only in AWS
# Secrets Manager and synced by ESO. 1h refresh supports license renewal
# without redeploying the vendor chart.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cots-vendor-license
  namespace: cots-vendor
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: cots-vendor-license       # resulting K8s Secret name
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: license.key
      remoteRef:
        key: cots/vendor/license-key
---
# Consumption: mount as read-only file at the path the vendor app expects,
# e.g. /opt/vendor/etc/license.key (volume mount, not env var — K8S-010).
