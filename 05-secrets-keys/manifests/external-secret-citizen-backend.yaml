# =============================================================================
# ExternalSecret — citizen-backend
# -----------------------------------------------------------------------------
# Same pattern as citizen-frontend: AWS Secrets Manager -> K8s Secret via ESO,
# 1h refresh, consumed as a read-only volume mount (K8S-010 fix — never env vars).
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: citizen-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backend-secrets           # resulting K8s Secret name
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: db-password
      remoteRef:
        key: citizen/backend/db-password
    - secretKey: jwt-signing-key
      remoteRef:
        key: citizen/backend/jwt-signing-key
    - secretKey: queue-credentials
      remoteRef:
        key: citizen/backend/queue-credentials
---
# Consumption (K8S-010 compliant):
#   volumes:
#     - name: secrets
#       secret:
#         secretName: backend-secrets
#         defaultMode: 0400
#   containers[].volumeMounts:
#     - name: secrets
#       mountPath: /var/run/secrets/app
#       readOnly: true
