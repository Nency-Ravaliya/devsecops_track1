# =============================================================================
# ExternalSecret — citizen-frontend
# -----------------------------------------------------------------------------
# Syncs secrets from AWS Secrets Manager into a K8s Secret "frontend-secrets".
# Refresh interval: 1h (rotation in Secrets Manager propagates within an hour;
# combine with Stakater Reloader for automatic pod restarts).
#
# K8S-010 FIX: secrets must be mounted as a *volume*, NOT injected as
# environment variables (env vars leak via /proc, crash dumps, child procs,
# and `kubectl describe`). See consumption example at the bottom.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: frontend-secrets
  namespace: citizen-frontend
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: frontend-secrets          # resulting K8s Secret name
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: db-password        # key inside the K8s Secret
      remoteRef:
        key: citizen/frontend/db-password
    - secretKey: api-key
      remoteRef:
        key: citizen/frontend/api-key
---
