# =============================================================================
# ClusterSecretStore — External Secrets Operator (ESO)
# -----------------------------------------------------------------------------
# Central store definition pointing at AWS Secrets Manager using IRSA
# (IAM Roles for Service Accounts). No static AWS credentials are stored
# in-cluster — the ESO controller's ServiceAccount assumes an IAM role
# via the EKS OIDC provider.
#
# Prerequisites:
#   - ESO installed (helm repo external-secrets/external-secrets)
#   - EKS OIDC provider associated with the cluster
#   - IAM role "eso-secrets-reader" with a trust policy for the ESO SA and
#     a policy allowing secretsmanager:GetSecretValue / DescribeSecret on
#     arn:aws:secretsmanager:eu-west-2:*:secret:citizen/* and cots/*
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        jwt:
          # IRSA: ESO controller SA annotated with
          # eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/eso-secrets-reader
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
