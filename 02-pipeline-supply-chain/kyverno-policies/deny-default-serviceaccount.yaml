# =============================================================================
# Kyverno ClusterPolicy: deny-default-serviceaccount
# -----------------------------------------------------------------------------
# Purpose:   Prevent pods in non-system namespaces from running as the
#            `default` ServiceAccount. Shared default SAs make workload
#            identity untraceable, break least-privilege RBAC, and (combined
#            with automounted tokens) widen the blast radius of a pod
#            compromise. Every workload must use a dedicated ServiceAccount.
# Findings:  K8S-003 (workloads using the default ServiceAccount)
# Severity:  High -> validationFailureAction: Enforce
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: deny-default-serviceaccount
  labels:
    app.kubernetes.io/part-of: devsecops-assessment-track1
    app.kubernetes.io/component: identity-least-privilege
    policy.assessment/module: "02-pipeline-supply-chain"
    policy.assessment/severity: high
  annotations:
    policies.kyverno.io/title: Disallow Default ServiceAccount
    policies.kyverno.io/category: Identity and Access
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.11.0
    assessment.findings/ids: "K8S-003"
    policies.kyverno.io/description: >-
      Blocks pods that use (explicitly or implicitly) the 'default'
      ServiceAccount in non-system namespaces. Each workload must declare a
      dedicated, least-privilege ServiceAccount.
spec:
  validationFailureAction: Enforce
  background: true
  failurePolicy: Fail
  rules:
    - name: block-default-serviceaccount
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
      validate:
        message: >-
          Pods must not use the 'default' ServiceAccount (K8S-003). Create a
          dedicated ServiceAccount with least-privilege RBAC and set
          spec.serviceAccountName. Note: omitting serviceAccountName
          implicitly selects 'default' and is also rejected.
        deny:
          conditions:
            any:
              # Explicitly set to default, or omitted (defaults to 'default')
              - key: "{{ request.object.spec.serviceAccountName || 'default' }}"
                operator: Equals
                value: default
