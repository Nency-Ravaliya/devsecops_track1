# =============================================================================
# Kyverno ClusterPolicy: verify-image-signatures
# -----------------------------------------------------------------------------
# Purpose:   Require Cosign signatures (KMS-backed key) on all container images
#            admitted to production and staging namespaces. Unsigned or
#            tampered images are rejected at admission.
# Findings:  K8S-011 (unsigned images in production), K8S-012 (no supply-chain
#            provenance verification at admission)
# Severity:  Critical -> validationFailureAction: Enforce
# Scope:     production/staging namespaces only; system and approved operator
#            namespaces are exempt.
# Key:       AWS KMS asymmetric signing key (eu-west-2). Replace ACCOUNT and
#            KEY-ID with the programme's values per environment.
# Notes:     mutateDigest rewrites tags to immutable digests after successful
#            verification, preventing tag-mutation attacks post-admission.
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  labels:
    app.kubernetes.io/part-of: devsecops-assessment-track1
    app.kubernetes.io/component: supply-chain-security
    policy.assessment/module: "02-pipeline-supply-chain"
    policy.assessment/severity: critical
  annotations:
    policies.kyverno.io/title: Verify Cosign Image Signatures
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.11.0
    assessment.findings/ids: "K8S-011,K8S-012"
    policies.kyverno.io/description: >-
      Requires that all images deployed to production and staging namespaces
      are signed with the programme's Cosign KMS key. Verified image tags are
      mutated to digests to guarantee immutability.
spec:
  validationFailureAction: Enforce
  background: false          # verifyImages is admission-time only
  failurePolicy: Fail        # fail closed if signature verification errors
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: environment
                    operator: In
                    values:
                      - production
                      - staging
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                # Approved operator namespaces (change-controlled list)
                - cert-manager
                - external-secrets
                - aws-load-balancer-controller
                - flux-system
      verifyImages:
        - imageReferences:
            - "*"            # all images in matched namespaces must be signed
          mutateDigest: true # rewrite tag -> digest after verification
          verifyDigest: true
          required: true
          failureAction: Enforce
          attestors:
            - count: 1
              entries:
                - keys:
                    # AWS KMS-backed Cosign public key (asymmetric, ECC_NIST_P256)
                    # Replace ACCOUNT and KEY-ID per environment.
                    kms: "awskms:///arn:aws:kms:eu-west-2:ACCOUNT:key/KEY-ID"
                    signatureAlgorithm: sha256
