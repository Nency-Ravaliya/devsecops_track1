apiVersion: apps/v1
kind: Deployment
metadata:
  name: goat-home
  labels:
    app: goat-home
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goat-home
  template:
    metadata:
      labels:
        app: goat-home
    spec:
      containers:
      - name: goat-home
        image: goat-home:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: goat-home
  namespace: kubernetes-goat
spec:
  type: NodePort
  selector:
    app: goat-home
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080