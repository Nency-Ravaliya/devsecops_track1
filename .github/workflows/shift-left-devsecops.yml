name: Shift-Left DevSecOps Pipeline

on:
  push:
    branches: ["main", "master", "dev"]
  pull_request:
    branches: ["main", "master", "dev", "ci/policy-gate"]

permissions:
  contents: read
  packages: write

env:
  CHECKOV_VERSION: "3.2.231"
  CONFTEST_VERSION: "0.56.0"
  GITLEAKS_VERSION: "8.21.6"
  KUBE_SCORE_VERSION: "1.18.0"
  TRIVY_VERSION: "0.55.2"
  GRYPE_VERSION: "0.82.0"
  COSIGN_VERSION: "2.4.3"
  KYVERNO_VERSION: "1.13.4"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/devsecops-track1:${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: Lint & Validate / Secret Scan
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/zricethezav/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin
          gitleaks --version
      - name: Run Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --exit-code 1 --redact

  # ---------------------------------------------------------------------------
  # STAGE 2: Policy & Security Gates
  # ---------------------------------------------------------------------------
  conftest-policy-gate:
    name: Conftest OPA policy gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Install Conftest
        run: |
          curl -sSL -o /tmp/conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v${{ env.CONFTEST_VERSION }}/conftest_${{ env.CONFTEST_VERSION }}_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/conftest.tar.gz -C /usr/local/bin
          conftest --version

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run policy gate script
        run: ./scripts/run_policy_gate.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: policy-gate-artifacts
          path: artifacts/policy-gate

  checkov-iac:
    name: Checkov IaC security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov IaC Scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/tf \
            bridgecrew/checkov:${{ env.CHECKOV_VERSION }} \
            --directory /tf \
            --framework terraform,cloudformation \
            --skip-path /tf/reference-target \
            --skip-path /tf/node_modules \
            --compact \
            --soft-fail-on MEDIUM,LOW \
            --hard-fail-on HIGH,CRITICAL \
            --output cli \
            2>&1 | tee checkov-report.txt || exit 1

  kube-score:
    name: kube-score manifest hygiene (soft-fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run kube-score
        run: |
          echo "Running kube-score on Kubernetes manifests (soft-fail — warn only)"
          find . \
            \( -path ./reference-target -prune -o -path ./node_modules -prune \) \
            -o -name "*.yaml" -o -name "*.yml" \
            -print0 2>/dev/null \
            | xargs -0 -r docker run --rm -i zegl/kube-score:v${{ env.KUBE_SCORE_VERSION }} score \
                --ignore-test=container-image-pull-policy \
                --ignore-test=pod-networkpolicy \
              2>&1 | tee kube-score-report.txt || true
          echo "kube-score complete (soft-fail)"

  kyverno-policy-bundle:
    name: Kyverno policy bundle validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kyverno YAML bundle
        shell: bash
        run: |
          if [ -d "02-pipeline-supply-chain/kyverno-policies" ]; then
            python3 - <<'PY'
          import glob
          import subprocess
          import sys

          try:
              import yaml
          except Exception:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pyyaml"])
              import yaml

          files = sorted(glob.glob("02-pipeline-supply-chain/kyverno-policies/*.[yY][aA][mM][lL]"))
          if not files:
              raise AssertionError("No Kyverno YAML files found")

          for f in files:
              with open(f, "r", encoding="utf-8") as fh:
                  list(yaml.safe_load_all(fh))
              print(f"Validated {f}")
          PY
          else
            echo "Kyverno policy directory not present; skipping validation"
          fi

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            aquasec/trivy:${{ env.TRIVY_VERSION }} \
            fs \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs reference-target \
            --exit-code 1 \
            /project

  # ---------------------------------------------------------------------------
  # STAGE 3: Build & Scan (SBOM)
  # ---------------------------------------------------------------------------
  build-and-sbom:
    name: Build image + generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build image
        run: |
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          echo "Using image: $IMAGE_NAME_LOWER"
          docker build -t "$IMAGE_NAME_LOWER" .
      - name: Generate CycloneDX SBOM
        run: |
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$GITHUB_WORKSPACE":/work aquasec/trivy:${{ env.TRIVY_VERSION }} image --format cyclonedx --output /work/sbom.cyclonedx.json "$IMAGE_NAME_LOWER"
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

  grype:
    name: Grype image scan
    needs: build-and-sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Grype scan
        run: |
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:${{ env.GRYPE_VERSION }} "$IMAGE_NAME_LOWER" --fail-on high --only-fixed --output json --file grype-report.json || true
      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: grype-report.json

  # ---------------------------------------------------------------------------
  # STAGE 4: Sign & Attest
  # ---------------------------------------------------------------------------
  cosign:
    name: Cosign image signing
    needs: build-and-sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ] || [ -z "$COSIGN_PASSWORD" ]; then
            echo "Cosign secrets not configured; skipping signing."
            exit 0
          fi
          curl -sSL -o /tmp/cosign.tar.gz https://github.com/sigstore/cosign/releases/download/v${{ env.COSIGN_VERSION }}/cosign-linux-amd64
          sudo install /tmp/cosign.tar.gz /usr/local/bin/cosign
      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ] || [ -z "$COSIGN_PASSWORD" ]; then
            echo "Cosign secrets not configured; skipping signing."
            exit 0
          fi
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          echo "$COSIGN_PRIVATE_KEY" > cosign.key
          cosign sign --key cosign.key --yes "$IMAGE_NAME_LOWER"
          cosign attach sbom --sbom sbom.cyclonedx.json "$IMAGE_NAME_LOWER"

  # ---------------------------------------------------------------------------
  # STAGE 5: Security Approval Gate & Deployment
  # ---------------------------------------------------------------------------
  security-approval:
    name: Protected Environment Security Approval
    needs: [gitleaks, conftest-policy-gate, checkov-iac, kube-score, kyverno-policy-bundle, trivy-fs, build-and-sbom, grype, cosign]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Record Security Sign-Off
        run: |
          echo "============================================================"
          echo "  Security Sign-Off Gate — Production Environment"
          echo "============================================================"
          echo "All automated policy gates (Gitleaks, Conftest, Checkov, Trivy, Cosign) passed."
          echo "Deployment approved for production."

  deploy-production:
    name: Production Deployment
    needs: security-approval
    runs-on: ubuntu-latest
    steps:
      - name: Execute Deployment
        run: |
          echo "Deploying container image to production cluster..."
          echo "Security sign-off verified."
