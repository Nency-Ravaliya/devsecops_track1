stages:
  - lint
  - test
  - policy
  - build

variables:
  GIT_DEPTH: "1"

gitleaks_scan:
  image: zricethezav/gitleaks:8.21.0
  stage: lint
  script:
    - gitleaks detect --source . --exit-code 1 || true

conftest_policy_gate:
  image: docker:20.10.16
  stage: policy
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache curl bash
    - curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz -o /tmp/conftest.tar.gz
    - tar -xzf /tmp/conftest.tar.gz -C /usr/local/bin
  script:
    - ./scripts/run_policy_gate.sh
  artifacts:
    paths:
      - artifacts/policy-gate/

trivy_scan:
  image: aquasec/trivy:0.44.0
  stage: test
  script:
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL . || true

build_placeholder:
  image: docker:20.10.16
  stage: build
  script:
    - echo "Build step placeholder - implement image build/push here as needed"
