# =============================================================================
# falco-daemonset.yaml
# Falco 0.38.2 DaemonSet — eBPF driver, NOT privileged (supported since 0.36)
#
# DevSecOps Assessment - Track 1 - Module 3 (Runtime Security)
# See: 03-runtime-security/runtime-detection-ir-plan.md, section 2.2
#
# Key architectural decision (from the IR plan):
#   Falco runs with privileged: false and drops ALL capabilities except the
#   minimum needed for the eBPF probe (SYS_ADMIN) and process inspection
#   (SYS_PTRACE). This avoids re-creating the exact anti-pattern the programme
#   is remediating (K8S-004/005/006 — privileged containers).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
  namespace: falco-system
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: runtime-security
---
# Falco needs read-only cluster visibility for Kubernetes metadata enrichment
# (pod/namespace/deployment labels on syscall events). No write verbs granted
# (least privilege — consistent with K8S-001/002/003 RBAC remediation).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: runtime-security
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, replicationcontrollers, services, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: runtime-security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco
subjects:
  - kind: ServiceAccount
    name: falco
    namespace: falco-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: falco-system
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/version: "0.38.2"
    app.kubernetes.io/part-of: runtime-security
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
        app.kubernetes.io/version: "0.38.2"
        app.kubernetes.io/part-of: runtime-security
      annotations:
        # Restart pods when rules ConfigMaps change (checksum injected by CI)
        checksum/rules: "{{ rules-checksum }}"
    spec:
      serviceAccountName: falco
      hostPID: false
      hostNetwork: false          # No host namespace sharing (K8S-006)
      dnsPolicy: ClusterFirst
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      tolerations:
        # Detection coverage must include control-plane / tainted nodes
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
      affinity:
        # One Falco pod per node — anti-affinity with itself
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: falco
              topologyKey: kubernetes.io/hostname
      initContainers:
        # -------------------------------------------------------------------
        # falco-driver-loader: downloads/builds and loads the eBPF probe.
        # On EKS 1.29+ with modern kernels this uses the modern eBPF (CO-RE)
        # probe — no kernel headers required on the node.
        # -------------------------------------------------------------------
        - name: falco-driver-loader
          image: falcosecurity/falco-driver-loader:0.38.2
          imagePullPolicy: IfNotPresent
          args: ["ebpf"]
          env:
            - name: FALCO_DRIVER_LOADER_DRIVER
              value: ebpf
            - name: HOST_ROOT
              value: /host
          securityContext:
            privileged: false
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [SYS_ADMIN, SYS_PTRACE]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: root-falco-fs
              mountPath: /root/.falco
            - name: proc-fs
              mountPath: /host/proc
              readOnly: true
            - name: boot-fs
              mountPath: /host/boot
              readOnly: true
      containers:
        - name: falco
          image: falcosecurity/falco:0.38.2
          imagePullPolicy: IfNotPresent
          args:
            - /usr/bin/falco
            - --disable-source
            - k8s_audit          # K8s audit events ingested via CloudWatch pipeline instead
            - -pk                # Kubernetes-friendly output format
          env:
            - name: FALCO_BPF_PROBE
              value: ""          # empty => use default probe path loaded by init container
            - name: HOST_ROOT
              value: /host
            - name: FALCO_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # NOT privileged — Falco 0.36+ supports least-privilege eBPF mode.
            # Only the two capabilities required for the eBPF engine:
            #   SYS_ADMIN  — bpf() syscall / perf buffers (kernels < 5.8)
            #   SYS_PTRACE — reading /proc/<pid> of other processes
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsUser: 0         # required to read host /proc; capabilities still restricted
            capabilities:
              drop: [ALL]
              add: [SYS_ADMIN, SYS_PTRACE]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          ports:
            - name: web
              containerPort: 8765
              protocol: TCP
          volumeMounts:
            # eBPF probe artefacts shared from the init container
            - name: root-falco-fs
              mountPath: /root/.falco
            # Host mounts required for the eBPF engine and event enrichment
            - name: proc-fs
              mountPath: /host/proc
              readOnly: true
            - name: boot-fs
              mountPath: /host/boot
              readOnly: true
            - name: dev-fs
              mountPath: /host/dev
              readOnly: true
            - name: etc-fs
              mountPath: /host/etc
              readOnly: true
            # Falco engine configuration
            - name: falco-config
              mountPath: /etc/falco/falco.yaml
              subPath: falco.yaml
              readOnly: true
            # Custom rules (Module 1 finding-driven) and exceptions
            - name: falco-rules-custom
              mountPath: /etc/falco/rules.d/falco-rules-custom.yaml
              subPath: falco-rules-custom.yaml
              readOnly: true
            - name: falco-exceptions
              mountPath: /etc/falco/rules.d/falco-exceptions.yaml
              subPath: falco-exceptions.yaml
              readOnly: true
      volumes:
        - name: root-falco-fs
          emptyDir: {}
        - name: proc-fs
          hostPath:
            path: /proc
        - name: boot-fs
          hostPath:
            path: /boot
        - name: dev-fs
          hostPath:
            path: /dev
        - name: etc-fs
          hostPath:
            path: /etc
        - name: falco-config
          configMap:
            name: falco-config
        - name: falco-rules-custom
          configMap:
            name: falco-rules-custom
        - name: falco-exceptions
          configMap:
            name: falco-exceptions
---
# Core Falco engine configuration (falco.yaml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-config
  namespace: falco-system
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: runtime-security
data:
  falco.yaml: |
    # Falco 0.38.x engine configuration
    engine:
      kind: ebpf                     # eBPF driver (no kernel module, K8S-006 safe)
    rules_files:
      - /etc/falco/falco_rules.yaml        # upstream community rules (150+)
      - /etc/falco/rules.d                 # custom rules + exceptions (this repo)
    load_plugins: []
    watch_config_files: true
    time_format_iso_8601: true
    json_output: true
    json_include_output_property: true
    json_include_tags_property: true
    priority: informational
    buffered_outputs: false
    outputs:
      rate: 0
      max_burst: 1000
    # Alerts routed to falcosidekick (see falcosidekick-deployment.yaml)
    http_output:
      enabled: true
      url: http://falcosidekick.falco-system.svc.cluster.local:2801
    stdout_output:
      enabled: true                  # also to CloudWatch via node log agent
    syslog_output:
      enabled: false
    webserver:
      enabled: true
      listen_port: 8765
      k8s_healthz_endpoint: /healthz
      ssl_enabled: false
    metrics:
      enabled: true
      interval: 1h
      output_rule: true
